# dnstune built-in resolver catalog.
#
# Only long-established, publicly documented resolvers live here, so the list
# does not rot. Regional or private resolvers belong in your own file:
#     dnstune bench --servers my-servers.toml
# (see examples/custom-servers.toml).
#
# filtering = true  ->  the resolver blocks ads, malware or adult domains by
#                       default. Such servers are skipped unless you pass
#                       --include-filtering.

schema_version = 1

[[server]]
label = "Cloudflare"
provider = "cloudflare"
address = "1.1.1.1"

[[server]]
label = "Cloudflare (secondary)"
provider = "cloudflare"
address = "1.0.0.1"

[[server]]
label = "Google"
