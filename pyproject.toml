[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dnstune"
dynamic = ["version"]
description = "Find the fastest trustworthy DNS servers on Linux and apply them safely, with automatic rollback."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "YOUR NAME" }]
keywords = ["dns", "linux", "resolver", "benchmark", "systemd-resolved", "networking", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
# Zero runtime dependencies on purpose: nothing upstream can break dnstune.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/YOUR-USERNAME/dnstune"
Issues = "https://github.com/YOUR-USERNAME/dnstune/issues"
Changelog = "https://github.com/YOUR-USERNAME/dnstune/blob/main/CHANGELOG.md"

[project.scripts]
dnstune = "dnstune.cli:main"

[tool.hatch.version]
path = "src/dnstune/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dnstune"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/engine",
    "/docs",
    "/examples",
    "/README.md",
    "/README.fa.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["dnstune"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/dnstune"]
warn_unreachable = true
