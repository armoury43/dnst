name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Type check
        run: python -m mypy
      - name: Test
        run: python -m pytest --cov --cov-report=term-missing

  go:
    name: Go engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: engine/go.mod
      - name: Format check
        run: test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test (race detector)
        run: go test -race -count=1 ./...
      - name: Build static binary
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/dnstune-probe .

  integration:
    name: Python + Go engine together
    runs-on: ubuntu-latest
    needs: [python, go]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: engine/go.mod
      - name: Build engine and install package
        run: |
          mkdir -p "$HOME/bin"
          (cd engine && CGO_ENABLED=0 go build -trimpath -o "$HOME/bin/dnstune-probe" .)
          python -m pip install -e .
      - name: Engine is detected and speaks the protocol
        run: |
          export PATH="$HOME/bin:$PATH"
          dnstune-probe --version
          dnstune bench --engine go --queries 1 --timeout 1 --json > /tmp/bench.json || true
          python -c "import json; d = json.load(open('/tmp/bench.json')); assert d['engine'] == 'go', d['engine']"
