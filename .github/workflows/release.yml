name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          cache-dependency-path: engine/go.mod
      - name: Build Python distributions
        run: |
          python -m pip install build
          python -m build
      - name: Build static Go engines
        run: |
          mkdir -p out
          for arch in amd64 arm64; do
            (cd engine && GOOS=linux GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w" -o "../out/dnstune-probe-linux-$arch" .)
          done
          cp dist/* out/
          (cd out && sha256sum * > SHA256SUMS)
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
